apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.default.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: default
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Heart Disease API
        orgId: 1
        folder: MLOps
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-heart-disease
  namespace: default
data:
  heart-disease-api.json: |
    {
      "uid": "heart-disease-api",
      "title": "Heart Disease API Monitoring",
      "tags": ["mlops", "heart-disease", "fastapi"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate by Endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (endpoint) (rate(heart_disease_api_requests_total[5m]))",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Total Requests by Endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum by (endpoint) (heart_disease_api_requests_total)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "95th Percentile Request Latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, endpoint) (rate(heart_disease_api_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP 5xx Errors in Last 5 Minutes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(increase(heart_disease_api_requests_total{status_code=~\"5..\"}[5m])) or vector(0)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Requests Currently In Progress",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 5, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "sum(heart_disease_api_requests_in_progress)",
              "legendFormat": "In progress",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value"
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "API Pod Scrape Health (1 = Up)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 5, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "up{job=\"heart-disease-api\"}",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "min": 0, "max": 1},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        }
      ]
    }
